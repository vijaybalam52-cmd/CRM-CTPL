version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: call_entryv7
    
    
    volumes:
      - mysql_data:/var/lib/mysql
      # Optional: automatically run SQL scripts
      - ./dumps:/docker-entrypoint-initdb.d

volumes:
  mysql_data: